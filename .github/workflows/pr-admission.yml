name: PR admission controller
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions: {}

jobs:
  admit:
    if: github.event_name == 'pull_request_target' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    concurrency:
      group: admit-pr-${{ github.event.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
      pull-requests: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      # Only base-branch code runs with this token. The merge tree is fetched
      # as Git objects, never checked out, installed, imported or executed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Report pending on the PR head
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state=pending -f context='Admitted PR CI' -f description='Checking the candidate before tests' --silent
      - name: Inspect merge tree with trusted base policy and dispatch its immutable SHA
        env:
          CI_TEST_ADMISSION_DIGESTS: ${{ vars.CI_TEST_ADMISSION_DIGESTS }}
        run: |
          set -euo pipefail
          # GitHub recalculates merge refs asynchronously; wait without changing the accepted parents.
          api_merge_sha=$(timeout --signal=KILL 60s node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { setTimeout as sleep } from "node:timers/promises";
          const deadline = performance.now() + 60_000;
          const stop = message => { console.error(message); process.exit(1); };
          const remaining = () => {
            const ms = Math.floor(deadline - performance.now());
            if (ms <= 0) stop("Merge readiness deadline expired");
            return ms;
          };
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            let pr;
            try {
              pr = JSON.parse(execFileSync("gh", ["api", `repos/${process.env.GITHUB_REPOSITORY}/pulls/${process.env.PR}`,
                "--jq", "{state,mergeable,merge_commit_sha,head:.head.sha,base:.base.sha}"],
                { encoding: "utf8", timeout: remaining(), killSignal: "SIGKILL", maxBuffer: 4096 }));
            } catch {
              stop("Merge readiness API failed or exceeded its remaining budget");
            }
            remaining();
            if (pr.state !== "open" || pr.head !== process.env.HEAD_SHA || pr.base !== process.env.BASE_SHA) {
              stop("PR state, head or base differs from the admitted event");
            }
            if (pr.mergeable === false) stop("PR mergeability is false");
            if (pr.mergeable === true) {
              if (!/^[0-9a-f]{40}$/u.test(pr.merge_commit_sha ?? "")) stop("Missing valid API merge SHA");
              remaining();
              process.stdout.write(pr.merge_commit_sha);
              process.exit(0);
            }
            if (pr.mergeable !== null) stop("Unsupported mergeability response");
            if (attempt === 12) stop("PR mergeability remains unknown after 12 queries");
            await sleep(Math.min(5000, remaining()));
          }
          NODE
          )
          git fetch --no-tags origin "refs/pull/$PR/merge"
          candidate=$(git rev-parse FETCH_HEAD)
          parents=$(git show -s --format=%P "$candidate")
          tree=$(git rev-parse "$candidate^{tree}")
          printf 'candidate=%s parents=%s expected=%s tree=%s api_merge=%s\n' "$candidate" "$parents" "$BASE_SHA $HEAD_SHA" "$tree" "$api_merge_sha"
          test "$candidate" = "$api_merge_sha"
          test "$parents" = "$BASE_SHA $HEAD_SHA"
          GITHUB_SHA="$candidate" node .github/scripts/test-admission.mjs --static-only
          tag="ci-admitted/pr-$PR/$candidate"
          # A branch can advance between approval and dispatch. Use the exact
          # reviewed merge commit, including for fork PRs.
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$candidate" --silent
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)" = "$candidate"
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=workflow_dispatch&head_sha=$candidate&per_page=100")
          existing=$(jq -c --arg tag "$tag" '[.workflow_runs[] | select(.head_branch == $tag)][0] // empty' <<< "$runs")
          if [[ -n "$existing" ]]; then
            current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '[.state,.head.sha,.merge_commit_sha] | @tsv')
            if [[ "$current" != "$(printf 'open\t%s\t%s' "$HEAD_SHA" "$candidate")" ]]; then exit 0; fi
            state=pending
            if [[ "$(jq -r .status <<< "$existing")" == completed ]]; then
              id=$(jq -r .id <<< "$existing")
              attempt=$(jq -r .run_attempt <<< "$existing")
              jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/attempts/$attempt/jobs?per_page=100")
              state=$(jq -r '[.jobs[] | select(.name == "Test (server + client, MySQL integration)")] | if length == 1 and .[0].status == "completed" and .[0].conclusion == "success" then "success" else "failure" end' <<< "$jobs")
            fi
            url=$(jq -r .html_url <<< "$existing")
            gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state="$state" -f context='Admitted PR CI' -f description='Reusing this exact admitted candidate run' -f target_url="$url" --silent
            exit 0
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$tag" -f admitted_pr="$PR"
      - name: Block PR if admission or dispatch failed
        if: failure() || cancelled()
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state=failure -f context='Admitted PR CI' -f description='Test admission or dispatch failed' -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent

  cleanup:
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.number }}
    steps:
      - name: Remove this closed PR's temporary candidate tags
        run: |
          set -euo pipefail
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .state)" != closed ]]; then exit 0; fi
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/ci-admitted/pr-$PR/" --jq '.[].ref')
          while IFS= read -r ref; do
            [[ "$ref" =~ ^refs/tags/ci-admitted/pr-$PR/[0-9a-f]{40}$ ]] || continue
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/${ref#refs/}" --silent
          done <<< "$refs"
