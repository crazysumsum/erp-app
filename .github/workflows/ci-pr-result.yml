name: Report admitted PR result
on:
  workflow_call:
    inputs:
      pr:
        required: true
        type: string
      result:
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ inputs.pr }}
      TEST_RESULT: ${{ inputs.result }}
    steps:
      # Trusted, externally approved YAML. No checkout, npm or candidate code.
      - name: Publish the actual aggregate result on the current PR head
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[1-9][0-9]*$ && "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          tag="ci-admitted/pr-$PR/$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/tags/$tag"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)" = "$GITHUB_SHA"
          head_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq 'if (.parents|length)==2 then .parents[1].sha else error("Not a PR merge") end')
          latest_attempt=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_attempt)
          if [[ "$latest_attempt" != "$GITHUB_RUN_ATTEMPT" ]]; then exit 0; fi
          current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '[.state,.head.sha,.merge_commit_sha] | @tsv')
          if [[ "$current" != "$(printf 'open\t%s\t%s' "$head_sha" "$GITHUB_SHA")" ]]; then
            echo "Candidate is no longer current; leaving its newer status alone."
            exit 0
          fi
          state=failure
          if [[ "$TEST_RESULT" == success ]]; then state=success; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$head_sha" -f state="$state" -f context='Admitted PR CI' -f description="Required Test: $TEST_RESULT" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
