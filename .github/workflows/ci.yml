name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:
    inputs:
      capacity_base:
        description: "Optional full baseline SHA: run existing capacity only for related changes since this ancestor"
        required: false
        type: string

permissions:
  contents: read

# 同一個 ref 有新的一輪 push 時，取消還在跑的舊一輪——PR 連續推幾次 commit
# 不需要每一輪都跑到底，跑到一半的舊結果反正也不會被採用。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Capacity impact scope
    runs-on: ubuntu-latest
    outputs:
      server_required: ${{ steps.scope.outputs.server_required }}
      client_required: ${{ steps.scope.outputs.client_required }}
      matrix: ${{ steps.scope.outputs.matrix }}
      selection: ${{ steps.scope.outputs.selection }}
    steps:
      - name: Check out repository and PR history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Verify scope and aggregate-check rules
        run: node --test .github/scripts/sales-import-capacity.test.mjs .github/scripts/coverage-shards-rules.test.mjs
      - name: Determine related capacity cases (unresolved impact fails closed)
        id: scope
        run: node .github/scripts/sales-import-capacity.mjs

  # Independent checks and coverage start immediately; capacity gets its own DB.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Scan dependencies
        run: npm run security:audit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint (server + client, including .vue)
        run: npm run lint

  # CLAUDE.md §9 要求每個前端改動都要做真瀏覽器驗證。在這個 job 出現之前，那件事
  # 只發生在誰記得跑它的機器上——PR 全綠從來不代表 e2e 跑過。
  #
  # 只跑 e2e:mocked。那一組（business-master、supplier-management）在 network 層
  # 假扮 API，只需要 client dev server，所以不必資料庫、跑得快、適合每個 PR 擋。
  # item-management 那一組是 executable UAT：它起真 server、連真 MySQL、要先跑
  # migration。把它塞進每個 PR 的 gate 是另一件事——成本和語意都不同，UAT 也不該
  # 是 per-PR gate——所以留給 harness 的正式驗收流程跑。
  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    # 與 package-lock.json 的 Playwright 1.63.0 一致；預裝瀏覽器、系統依賴及字型，
    # 避免每輪 apt 下載受 Ubuntu mirror 波動影響。setup-node 仍固定 Node 26。
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --init --ipc=host
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run browser tests (network-mocked suites)
        run: npm run e2e:mocked

  server-tests:
    name: Server coverage shard (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services: &mysql_services
      mysql:
        image: mysql:26.7.0
        env:
          # MySQL 官方映像收到這三個變數會自動建庫、建帳號並把該資料庫的
          # 全部權限授予這個帳號——同 server/database/init.sql 手動做的事一樣，
          # 這裡不必再另外跑一次 init.sql。權限含 DROP，migrations/
          # 0003_add_auth_tables.js 換走 demo users 表需要的就是這個。
          MYSQL_DATABASE: erp_dev
          MYSQL_USER: erp_user
          MYSQL_PASSWORD: erp_password
          MYSQL_ROOT_PASSWORD: root
        volumes:
          - /tmp/erp-ci-mysql-socket:/var/run/mysqld
        ports:
          - 3306:3306
        # GitHub Actions 會等 service 的健康檢查通過才開始跑這個 job 的 steps，
        # 所以不需要另外寫一個「等 MySQL 就緒」的 step。
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env: &database_env
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: erp_user
      DB_PASSWORD: erp_password
      DB_NAME: erp_dev
      # Only fixture trigger DDL and isolated recovery setup use this ephemeral admin.
      DB_ADMIN_USER: root
      DB_ADMIN_PASSWORD: root
      # 打開 test/integration/authFlow.integration.test.js 那組真連線測試。
      # 本機沒設這個變數時它們會 skip 而不是失敗，讓沒裝 MySQL 的環境仍然可以
      # 跑 npm test；CI 這裡確定有一個剛 migrate 過的 MySQL，設了就要求它真的
      # 跑起來、真的通過——連不上不該被靜默跳過，那會把「CI 的 MySQL 設定壞了」
      # 偽裝成「一切正常」。
      DB_INTEGRATION_TESTS: "1"
      # Customer/Supplier Bank capabilities share key rings and separate records with AAD.
      # Both modules must therefore be configured together or startup fails closed.
      #
      # 呢兩條係**CI 專用嘅測試 key**，一次產生之後就 commit 咗落嚟，同任何環境嘅真
      # key 無關。佢哋喺一個 public repo 入面，即係任何人都睇得到 —— 所以佢哋唔係
      # secret，亦都唔可以喺 CI 以外任何地方用。設計 §1700：開發／測試不得提交固定
      # production key。輪替佢哋唔需要任何協調：改咗就算。
      SUPPLIER_BANK_ACTIVE_KEY_ID: ci-enc-1
      SUPPLIER_BANK_ENCRYPTION_KEYS: '{"ci-enc-1":"R4EVice6+okHiRFgg4gm0rYpYKWA8HMxCVjxOlS9RQg="}'
      SUPPLIER_BANK_LOOKUP_ACTIVE_KEY_ID: ci-look-1
      SUPPLIER_BANK_LOOKUP_KEYS: '{"ci-look-1":"THGVVay+dFBH7xi7a8a/BPGP/g16GnMI4Tu85N1AMMw="}'
      CUSTOMER_BANK_ACTIVE_KEY_ID: ci-enc-1
      CUSTOMER_BANK_ENCRYPTION_KEYS: '{"ci-enc-1":"R4EVice6+okHiRFgg4gm0rYpYKWA8HMxCVjxOlS9RQg="}'
      CUSTOMER_BANK_LOOKUP_ACTIVE_KEY_ID: ci-look-1
      CUSTOMER_BANK_LOOKUP_KEYS: '{"ci-look-1":"THGVVay+dFBH7xi7a8a/BPGP/g16GnMI4Tu85N1AMMw="}'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify exact MySQL server version
        run: test "$(docker exec "${{ job.services.mysql.id }}" mysql -uroot -proot --batch --skip-column-names -e "SELECT VERSION();")" = "26.7.0"

      - name: Apply database migrations
        # The ephemeral migration account may create immutable triggers; application tests stay on erp_user.
        env:
          DB_USER: root
          DB_PASSWORD: root
        run: npm run migrate --workspace server

      - name: Collect native server coverage for this shard
        # Each shard stays serial on its own DB; the merged report enforces the original floors.
        env:
          SALES_CAPACITY_SEPARATE_STEP: "1"
          SALES_IMPORT_CAPACITY_SEPARATE_STEP: "1"
          # This native-only lane has applied the complete P0 schema; keep deployment default off.
          FULFILLMENT_LIFECYCLE_ENABLED: "true"
          # Match the owned native runtime transport; keep all transaction deadlines unchanged.
          DB_SOCKET_PATH: /tmp/erp-ci-mysql-socket/mysqld.sock
          NODE_V8_COVERAGE: ${{ github.workspace }}/server/coverage/shard/raw
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import mysql from 'mysql2/promise';
          const db=await mysql.createConnection({socketPath:process.env.DB_SOCKET_PATH,user:process.env.DB_USER,password:process.env.DB_PASSWORD,database:process.env.DB_NAME});
          try {
            const [[identity]]=await db.query('SELECT @@socket AS socket, CURRENT_USER() AS account, USER() AS peer');
            assert.equal(identity.socket,'/var/run/mysqld/mysqld.sock');
            assert.ok(identity.account.startsWith(process.env.DB_USER+'@'));
            assert.ok(identity.peer.endsWith('@localhost'));
            console.log('Native CI transport verified:',JSON.stringify(identity));
          } finally {await db.end();}
          NODE
          capacity_pattern="$(NODE_V8_COVERAGE= node .github/scripts/capacity-runner.mjs server-pattern)"
          npm run test:coverage:shard --workspace server -- --test-shard=${{ matrix.shard }}/4 --test-skip-pattern="$capacity_pattern"

      - name: Record candidate and shard identity
        working-directory: server
        run: node ../.github/scripts/merge-server-coverage.test.mjs record ${{ matrix.shard }} 4

      # Keep the existing real P1 browser gate after routine coverage.
      - name: Install Chromium for real Fulfillment P1 browser flows
        if: matrix.shard == 1
        run: npx playwright install --with-deps chromium

      - name: Run real Fulfillment P1 browser flows on an owned UUID database
        if: matrix.shard == 1
        env:
          DB_SOCKET_PATH: /tmp/erp-ci-mysql-socket/mysqld.sock
          JWT_SECRET: fulfillment-ci-only-synthetic-secret-32-characters
          NODE_ENV: test
          FULFILLMENT_LIFECYCLE_ENABLED: "true"
          FULFILLMENT_TEST_API_PORT: "53001"
          FULFILLMENT_TEST_CLIENT_PORT: "53002"
          HARNESS_RUN_DIR: ${{ runner.temp }}/fulfillment-p1-browser
        run: |
          npx playwright test --config client/e2e/fulfillment-shipping-management/p1.playwright.config.js
          python3 - <<'PY'
          import os, pathlib, xml.etree.ElementTree as ET
          report=pathlib.Path(os.environ['HARNESS_RUN_DIR'])/'fulfillment-p1-browser.xml'
          root=ET.parse(report).getroot()
          assert len(list(root.iter('testcase')))==2, 'Both real P1 flows must execute'
          assert not any(list(root.iter(tag)) for tag in ['failure','error','skipped']), 'P1 failures/skips block CI'
          PY

      - name: Retain synthetic Fulfillment P1 browser report
        if: always() && matrix.shard == 1
        uses: actions/upload-artifact@v4
        with:
          name: fulfillment-p1-browser-report
          path: ${{ runner.temp }}/fulfillment-p1-browser/fulfillment-p1-browser.xml
          if-no-files-found: error

      - name: Upload this shard's raw coverage
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage-${{ matrix.shard }}
          path: server/coverage/shard
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  client-tests:
    name: Client coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run client coverage with existing thresholds
        run: |
          functional_pattern="$(node .github/scripts/capacity-runner.mjs client-pattern)"
          npm run test:coverage --workspace client -- --testNamePattern="$functional_pattern"

  regression:
    name: Test coverage (server + client, MySQL integration)
    needs: [server-tests, client-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Download every coverage shard from this run
        uses: actions/download-artifact@v4
        with:
          pattern: server-coverage-*
          path: server/coverage/shards
          merge-multiple: false
      - name: Merge native coverage and enforce unchanged global and per-file floors
        env:
          COVERAGE_SHARD_ROOT: ${{ github.workspace }}/server/coverage/shards
          COVERAGE_SHARD_TOTAL: "4"
        run: npm run test:coverage:merge --workspace server

  server-capacity:
    name: Related server capacity (${{ matrix.group }})
    needs: changes
    if: needs.changes.outputs.server_required == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Stop this capacity batch after a failure; preserve routine regression results.
      fail-fast: true
      max-parallel: 2
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    services: *mysql_services
    env: *database_env
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify exact MySQL server version
        run: test "$(docker exec "${{ job.services.mysql.id }}" mysql -uroot -proot --batch --skip-column-names -e "SELECT VERSION();")" = "26.7.0"
      - name: Apply database migrations
        env:
          DB_USER: root
          DB_PASSWORD: root
        run: npm run migrate --workspace server
      - name: Run only selected existing capacity cases without coverage
        env:
          CAPACITY_SELECTION: ${{ needs.changes.outputs.selection }}
          CAPACITY_GROUP: ${{ matrix.group }}
        run: |
          # Sales keeps the original TC-032/035/042 TCP runtime. Extracted native
          # cases and Fulfillment keep their original socket/lifecycle runtime.
          if [ "$CAPACITY_GROUP" != "sales" ]; then
            export DB_SOCKET_PATH=/tmp/erp-ci-mysql-socket/mysqld.sock
            export FULFILLMENT_LIFECYCLE_ENABLED=true
          fi
          node .github/scripts/capacity-runner.mjs run "$CAPACITY_GROUP"
      - name: Retain capacity results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capacity-${{ matrix.group }}-report
          path: capacity-${{ matrix.group }}.tap
          if-no-files-found: error

  client-capacity:
    name: Related client capacity
    needs: changes
    if: needs.changes.outputs.client_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run only selected existing client capacity cases
        env:
          CAPACITY_SELECTION: ${{ needs.changes.outputs.selection }}
        run: node .github/scripts/capacity-runner.mjs run client
      - name: Retain client capacity results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capacity-client-report
          path: client/capacity-client.json
          if-no-files-found: error

  # Keep the original check name stable; required failures/skips cannot turn green.
  test:
    name: Test (server + client, MySQL integration)
    if: always()
    needs: [changes, regression, server-capacity, client-capacity, audit, lint, build, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Require all checks and the selected capacity result
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: node .github/scripts/sales-import-capacity.mjs check

  build:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build --workspace client
